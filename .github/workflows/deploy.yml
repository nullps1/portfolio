name: Deploy

# Manual only until credentials, the production environment, and rollback have been reviewed.
# To deploy on every push to main, add:  push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false # keep a single plain manifest so the digest maps to exactly one arm64 image
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Deploy to Oracle (restricted SSH forced command, rolls back on failure)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Verify public site is served from Oracle
        run: |
          curl -fsSI https://weeksitsolutions.com/healthz | tee /dev/stderr | grep -i '^x-origin: oci-portfolio'
