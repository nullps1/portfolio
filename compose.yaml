services:
  portfolio:
    # Build-from-source file for local experiments ONLY. Never run it on the Oracle host: it uses the same
    # project and container name as production. Releases go GitHub Actions -> GHCR -> the restricted
    # portfolio-deploy program, which uses the root-owned deploy/host/compose.yaml (see docs/DEPLOYMENT.md).
    image: ${PORTFOLIO_IMAGE:-portfolio:local}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: portfolio
    restart: unless-stopped
    # Loopback only: the host Caddy proxies to it. Not reachable from the internet.
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
