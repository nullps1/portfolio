server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy in front handles compression, TLS, and access logging.
    access_log off;
    server_tokens off;

    # Always revalidate and rely on ETag, so a redeploy is visible immediately.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    # Identifies this origin; deploy checks and monitoring look for it.
    add_header X-Origin "oci-portfolio" always;

    location = /healthz {
        default_type text/plain;
        # add_header in a location replaces inherited ones, so repeat X-Origin here.
        add_header Cache-Control "no-store" always;
        add_header X-Origin "oci-portfolio" always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
